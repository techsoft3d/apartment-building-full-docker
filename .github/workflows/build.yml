name: Docker Demo on Self-Hosted Runner

on:
  push:
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  run-in-oregon:
    name: Run on Oregon Runner
    runs-on: [self-hosted, oregon]
    steps:
      - name: Fix file ownership
        run: sudo chown -R $USER:$USER $GITHUB_WORKSPACE

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Identify runner
        run: |
          echo "hostname=$(hostname)"
          echo "public_ip=$(curl -s https://checkip.amazonaws.com || true)"
          echo "private_ips="
          ip -4 addr | sed -n 's/.*inet \([0-9.]*\)\/.*/\1/p'

      - name: Create hoops_license.txt
        run: |
          echo "${{ secrets.HOOPS_LICENSE }}" | base64 --decode > hoops_license.txt
          ls -l hoops_license.txt

      - name: Write SSL certificates to files (from secrets)
        run: |
          mkdir -p certs
          echo "${{ secrets.SSL_CERT }}" > certs/server.crt
          echo "${{ secrets.SSL_KEY }}"  > certs/server.key
          echo "${{ secrets.CA_CERT }}"  > certs/ca.crt
          ls -la certs/

      - name: Show expected cert identity (from secrets)
        run: |
          openssl x509 -in certs/server.crt -noout -dates -serial -subject -issuer

      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Force refresh proxy image (pull latest digest)
        run: |
          docker pull ghcr.io/techsoft3d/proxy-server:latest
          docker image inspect ghcr.io/techsoft3d/proxy-server:latest --format 'pulled={{index .RepoDigests 0}}'

      - name: Pull latest images
        run: |
          docker pull ghcr.io/techsoft3d/streaming-server:latest
          docker pull ghcr.io/techsoft3d/node-server:latest
          docker pull ghcr.io/techsoft3d/proxy-server:latest
          docker pull alpine:latest || true

      - name: Copy ./public, ./patches, ./models into External Docker Volumes
        run: |
          docker run --rm -v public:/volume  -v "$(pwd)/public:/backup"  alpine sh -c "cp -r /backup/* /volume/ && ls -la /volume/"
          docker run --rm -v patches:/volume -v "$(pwd)/patches:/backup" alpine sh -c "cp -r /backup/* /volume/ && ls -la /volume/"
          docker run --rm -v models:/volume  -v "$(pwd)/models:/backup"  alpine sh -c "cp -r /backup/* /volume/ && ls -la /volume/"

      - name: Deploy (force recreate)
        run: |
          docker-compose pull proxy-server || true
          docker-compose up -d --force-recreate

      - name: Hard restart proxy (surgical)
        run: |
          docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Ports}}"
          docker rm -f proxy-server || true
          docker pull ghcr.io/techsoft3d/proxy-server:latest
          docker-compose up -d --force-recreate
          docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Ports}}"

      - name: Show running containers + proxy image reference
        run: |
          docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Ports}}"
          docker inspect proxy-server --format 'running_image={{.Image}}' || true
          docker image inspect ghcr.io/techsoft3d/proxy-server:latest --format 'local={{index .RepoDigests 0}}'

      - name: Runtime TLS check on localhost (extract leaf + compare to expected)
        run: |
          set -euo pipefail

          EXPECTED_SERIAL="$(openssl x509 -in certs/server.crt -noout -serial | cut -d= -f2)"
          echo "EXPECTED_SERIAL=$EXPECTED_SERIAL"

          timeout 15 openssl s_client \
            -connect 127.0.0.1:443 \
            -servername cad-model-streaming-docker.techsoft3d.com \
            -showcerts </dev/null > /tmp/sclient.txt 2>&1 || true

          awk 'BEGIN{p=0}
               /-----BEGIN CERTIFICATE-----/{p=1}
               p{print}
               /-----END CERTIFICATE-----/{exit}' /tmp/sclient.txt > /tmp/leaf.pem

          if [ ! -s /tmp/leaf.pem ]; then
            echo "NO_CERT_EXTRACTED (127.0.0.1:443 is not serving TLS properly)"
            sed -n '1,120p' /tmp/sclient.txt || true
            exit 1
          fi

          echo "=== RUNTIME leaf cert ==="
          openssl x509 -in /tmp/leaf.pem -noout -dates -serial -subject -issuer

          RUNTIME_SERIAL="$(openssl x509 -in /tmp/leaf.pem -noout -serial | cut -d= -f2)"
          echo "RUNTIME_SERIAL=$RUNTIME_SERIAL"

          if [ "$RUNTIME_SERIAL" != "$EXPECTED_SERIAL" ]; then
            echo "MISMATCH: runtime cert != secrets cert"
            exit 1
          fi

  run-in-paris:
    name: Run on Paris Runner
