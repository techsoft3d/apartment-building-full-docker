name: Docker Demo on Self-Hosted Runner

on:
  push:
    branches:
      - main

jobs:
  run-in-oregon:
    name: Run on Orgeon Runner
    runs-on: [self-hosted, oregon] # Runs on your self-hosted runner
    steps:
      - name: Fix file ownership
        run: sudo chown -R $USER:$USER $GITHUB_WORKSPACE
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create hoops_license.txt
        run: |
          echo "${{ secrets.HOOPS_LICENSE }}" | base64 --decode > hoops_license.txt
          ls -l hoops_license.txt  # Verify file exists
          cat hoops_license.txt  # Debugging: Check file content (remove in production)

      - name: Show pulled proxy digest
        run: |
          docker pull ghcr.io/techsoft3d/proxy-server:latest
          docker image inspect ghcr.io/techsoft3d/proxy-server:latest --format '{{index .RepoDigests 0}}'

          

      - name: Write SSL certificates to files
        run: |
          pwd  # Print the current working directory
          ls -la  # List files before creating certs
          mkdir -p certs
          echo "${{ secrets.SSL_CERT }}" > certs/server.crt
          echo "${{ secrets.SSL_KEY }}" > certs/server.key
          echo "${{ secrets.CA_CERT }}" > certs/ca.crt

      - name: Show proxy container and inspect TLS cert (runtime)
        run: |
          set -e
          echo "=== containers ==="
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Ports}}'
          echo "=== find container exposing 443 ==="
          PROXY=$(docker ps --format '{{.Names}} {{.Ports}}' | awk '/:443->/ {print $1; exit}')
          echo "PROXY=$PROXY"
          echo "=== try common paths ==="
          docker exec "$PROXY" sh -lc 'ls -la /etc/nginx || true; ls -la /etc/nginx/ssl || true; ls -la /certs || true; ls -la /ssl || true'
          echo "=== grep nginx conf for cert paths ==="
          docker exec "$PROXY" sh -lc 'grep -R --line-number -E "ssl_certificate|ssl_certificate_key" /etc/nginx 2>/dev/null || true'
          echo "=== print served cert file if found ==="
          docker exec "$PROXY" sh -lc '
            for f in \
              /etc/nginx/ssl/server.crt \
              /etc/nginx/ssl/fullchain.pem \
              /etc/nginx/ssl/cert.pem \
              /certs/server.crt \
              /ssl/server.crt \
              /etc/ssl/certs/server.crt
            do
              if [ -f "$f" ]; then
                echo "--- $f ---"
                openssl x509 -in "$f" -noout -dates -serial -subject -issuer || true
              fi
            done
          '

      - name: Verify SSL Certificates
        run: |
          echo "🔍 Checking SSL certificate files..."
          if [ ! -s certs/server.crt ] || [ ! -s certs/server.key ]; then
            echo "❌ Error: SSL certificate files are missing or empty!"
            exit 1
          fi
          ls -la certs/

      - name: Show pulled proxy image digest
        run: |
          docker pull ghcr.io/techsoft3d/proxy-server:latest
          docker image inspect ghcr.io/techsoft3d/proxy-server:latest --format '{{index .RepoDigests 0}}'

      - name: Show deployed SSL cert identity 
        run: |
          openssl x509 -in certs/server.crt -noout -serial -dates -issuer -subject
      - name: Identify runner 
        run: |
          echo "hostname=$(hostname)"
          echo "public_ip=$(curl -s https://checkip.amazonaws.com || true)"
          echo "private_ips="
          ip -4 addr | sed -n 's/.*inet \([0-9.]*\)\/.*/\1/p'
      - name: Show containers and ports
        run: |
          docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Ports}}"
          echo "---- candidates exposing 443 ----"
          docker ps --format "{{.Names}} {{.Ports}}" | grep -E "(:443->|0\.0\.0\.0:443->|\[::\]:443->)" || true

      - name: Inspect cert inside 443 container (safe)
        run: |
          PROXY=$(docker ps --format "{{.Names}} {{.Ports}}" | awk '$0 ~ /:443->/ {print $1; exit}')
          echo "proxy_container=$PROXY"
          if [ -z "$PROXY" ]; then
            echo "No container exposing 443 on this runner"
            exit 0
          fi

          echo "---- list likely cert dirs ----"
          docker exec "$PROXY" sh -lc 'ls -la /etc/nginx /etc/nginx/certs /certs /etc/ssl 2>/dev/null || true'

          echo "---- try reading common cert paths ----"
          docker exec "$PROXY" sh -lc '
            for f in \
              /etc/nginx/certs/server.crt \
              /etc/nginx/certs/fullchain.pem \
              /etc/nginx/certs/cert.pem \
              /etc/ssl/certs/server.crt \
              /certs/server.crt \
              /certs/fullchain.pem
            do
              if [ -f "$f" ]; then
                echo "FOUND $f"
                openssl x509 -in "$f" -noout -serial -dates -subject -issuer || true
              fi
            done
          '

      - name: Login to GitHub Packages
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Clean up server
        run: docker image prune -af

      - name: Pull Latest Docker Images
        run: |
          docker pull ghcr.io/techsoft3d/streaming-server:latest
          docker pull ghcr.io/techsoft3d/node-server:latest
          docker pull ghcr.io/techsoft3d/proxy-server:latest

      - name: Copy ./public into External Docker Volume (Using Temporary Container)
        run: |
          docker run --rm \
            -v public:/volume \
            -v $(pwd)/public:/backup \
            alpine sh -c "cp -r /backup/* /volume/ && ls -la /volume/"

          docker run --rm \
            -v patches:/volume \
            -v $(pwd)/patches:/backup \
            alpine sh -c "cp -r /backup/* /volume/ && ls -la /volume/"
          docker run --rm \
            -v models:/volume \
            -v $(pwd)/models:/backup \
            alpine sh -c "cp -r /backup/* /volume/ && ls -la /volume/"

      - name: Build and Run Docker Containers
        run: |
          docker-compose up -d --force-recreate

  run-in-paris:
    name: Run on Paris Runner
    runs-on: [self-hosted, paris] # Runs on your self-hosted runner
    steps:
      - name: Fix file ownership
        run: sudo chown -R $USER:$USER $GITHUB_WORKSPACE
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create hoops_license.txt
        run: |
          echo "${{ secrets.HOOPS_LICENSE }}" | base64 --decode > hoops_license.txt
          ls -l hoops_license.txt  # Verify file exists
          cat hoops_license.txt  # Debugging: Check file content (remove in production)

      - name: Write SSL certificates to files
        run: |
          pwd  # Print the current working directory
          ls -la  # List files before creating certs
          mkdir -p certs
          echo "${{ secrets.SSL_CERT }}" > certs/server.crt
          echo "${{ secrets.SSL_KEY }}" > certs/server.key
          echo "${{ secrets.CA_CERT }}" > certs/ca.crt

      - name: Verify SSL Certificates
        run: |
          echo "🔍 Checking SSL certificate files..."
          if [ ! -s certs/server.crt ] || [ ! -s certs/server.key ]; then
            echo "❌ Error: SSL certificate files are missing or empty!"
            exit 1
          fi
          ls -la certs/

      - name: Login to GitHub Packages
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Clean up server
        run: docker image prune -af

      - name: Pull Latest Docker Images
        run: |
          docker pull ghcr.io/techsoft3d/streaming-server:latest
          docker pull ghcr.io/techsoft3d/node-server:latest
          docker pull ghcr.io/techsoft3d/proxy-server:latest

      - name: Copy ./public into External Docker Volume (Using Temporary Container)
        run: |
          docker run --rm \
            -v public:/volume \
            -v $(pwd)/public:/backup \
            alpine sh -c "cp -r /backup/* /volume/ && ls -la /volume/"

          docker run --rm \
            -v patches:/volume \
            -v $(pwd)/patches:/backup \
            alpine sh -c "cp -r /backup/* /volume/ && ls -la /volume/"
          docker run --rm \
            -v models:/volume \
            -v $(pwd)/models:/backup \
            alpine sh -c "cp -r /backup/* /volume/ && ls -la /volume/"

      - name: Build and Run Docker Containers
        run: |
          docker-compose up -d --force-recreate
